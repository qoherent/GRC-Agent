[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grc-agent"
version = "0.3.1"
description = "Autonomous AI agent for GNU Radio Companion — reasons over, edits, and validates .grc flowgraphs, built on PydanticAI."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "AGPL-3.0-only"}
authors = [{name = "Mahmoud Sallam", email = "mahmoud.sallam@mail.mcgill.ca"}, {name = "Qoherent"}]
keywords = [
    "gnu-radio",
    "sdr",
    "llm",
    "agent",
    "code-generation",
    "local-llm",
    "ollama",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.0",
    "sqlite-vec>=0.1.9,<0.2",
    "tenacity>=9.1.4",
    "pydantic-ai[web-fetch]>=2.7.0,<3",
    "pydantic-graph>=2.7.0,<3",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "grandalf>=0.8",
    # asyncio+GLib unification. PyGObject >= 3.50 provides this in-tree as
    # `gi.events`, so gbulb is only needed on older PyGObject (Ubuntu 24.04
    # ships 3.48). Marked by Python version because gbulb pins PyGObject
    # 3.48 as a source build, which cannot compile on 3.14.
    "gbulb>=0.6.6; python_version < '3.13'",
    "markdown-it-py>=3.0.0",
    "ddgs>=9.0",
    "pydantic-ai-harness[prompt-injection-defender]>=0.23.0",
    # Official provider SDKs for the pydantic-ai models the Settings UI
    # exposes (anthropic/google ship with pydantic-ai-slim's own extras;
    # these four are separate SDKs pydantic-ai wraps).
    "groq>=0.9",
    "mistralai>=1.0",
    "cohere>=5.0",
    "xai-sdk>=0.1",
    # Syntax highlighting in rendered code blocks (code_block.py).
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "ruff>=0.15.9",
    "pytest>=8.0.0",
    # Required by the suite's one `@pytest.mark.asyncio` test. Without it the
    # marker is unknown and pytest >= 9 fails the test outright rather than
    # silently not running it.
    "pytest-asyncio>=1.0",
]

[project.scripts]
grc-agent = "grc_agent.desktop_app:main"

[project.urls]
Homepage = "https://github.com/qoherent/grc-agent"
Repository = "https://github.com/qoherent/grc-agent"
Issues = "https://github.com/qoherent/grc-agent/issues"

[tool.hatch.build.targets.sdist]

[tool.hatch.build.targets.sdist.force-include]
"docs/wiki_gnuradio_org" = "docs/wiki_gnuradio_org"

[tool.hatch.build.targets.wheel]
packages = ["src/grc_agent"]

[tool.hatch.build.targets.wheel.force-include]
"docs/wiki_gnuradio_org" = "grc_agent/docs/wiki_gnuradio_org"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# GNU-Radio-generated flowgraph companion scripts, not hand-authored source —
# linting/rewriting them would make them diverge from GRC's own codegen output.
extend-exclude = ["tests/data/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C901", "A", "SIM", "ARG"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
strict_optional = true
namespace_packages = false
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
